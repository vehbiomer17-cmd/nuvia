<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración — GLUNOVA</title><link rel="icon" href="logo.jpeg" type="image/jpeg"><link rel="stylesheet" href="styles.css?v=20261027-logo"><link rel="stylesheet" href="admin.css"><script src="config.js" defer></script><script src="content.js" defer></script><script src="admin.js" defer></script></head>
<body class="admin-page"><header class="admin-header"><a href="index.html" class="logo"><img src="logo.jpeg" alt="GLUNOVA" width="100" height="70"></a><a href="index.html">Volver al sitio ↗</a><button id="logout" class="button secondary" hidden>Cerrar sesión</button></header>
<main class="admin-main"><h1>Administración</h1><p>Compartí nuevas experiencias y actualizá el catálogo de GLUNOVA.</p><p id="status" role="status" aria-live="polite">Conectando…</p><noscript>Activá JavaScript para administrar el sitio.</noscript>
<section id="login-panel" class="admin-panel" hidden><h2>Ingresar</h2><form id="login-form"><label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="button" type="submit">Ingresar</button><button class="button secondary" type="button" id="forgot">Olvidé mi contraseña</button></form></section>
<section id="recovery-panel" class="admin-panel" hidden><h2>Nueva contraseña</h2><form id="recovery-form"><label>Nueva contraseña (mínimo 12 caracteres)<input name="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Repetir contraseña<input name="confirmation" type="password" minlength="12" autocomplete="new-password" required></label><button class="button">Guardar contraseña</button></form></section>
<section id="dashboard" hidden><div class="admin-tabs"><button class="button" data-tab="experiences" aria-pressed="true">Experiencias</button><button class="button secondary" data-tab="products" aria-pressed="false">Productos</button></div>
<div class="admin-layout"><section class="admin-panel"><h2 id="editor-title">Nueva experiencia</h2><form id="content-form"></form></section><section class="admin-panel"><h2 id="list-title">Experiencias</h2><p>Los borradores solo aparecen en este panel.</p><div id="content-list"></div></section></div></section></main></body></html>
